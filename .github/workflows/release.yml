name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The App's token does the writing, so this job's own token needs nothing.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pushes and pull requests made with GITHUB_TOKEN start no workflow runs,
      # so checks would never run on the release pull request.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish-image:
    needs: release-please
    # Keep the SINGULAR output: it is only ever set (to true) when a release
    # exists. The plural releases_created is always set, and its string
    # "false" would be truthy here.
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-config-schema:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-config-schema.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  notify-deploy:
    needs: [release-please, publish-image]
    runs-on: ubuntu-latest
    # The App's token does the writing, so this job's own token needs nothing.
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: eventail-deploy
          permission-contents: write
      - run: >-
          gh api "repos/$GITHUB_REPOSITORY_OWNER/eventail-deploy/dispatches"
          -f event_type=image-released
          -f "client_payload[component]=$COMPONENT"
          -f "client_payload[version]=${TAG_NAME#v}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMPONENT: furry-schedule-adapter
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
