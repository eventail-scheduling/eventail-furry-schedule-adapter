name: Publish the configuration schema

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v0.1.2
        required: true

concurrency:
  group: publish-config-schema

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$TAG is not a release tag"
              exit 1
          fi

          version="${TAG#v}"
          minor="${version%.*}"
          newest="$(
              git ls-remote --tags --refs "$REPOSITORY_URL" "refs/tags/v$minor.*" \
                  | sed 's|.*refs/tags/||' \
                  | sort -V \
                  | tail -n 1
          )"

          if [[ "$newest" != "$TAG" ]]; then
              echo "::error::$newest is the newest release of $minor, so $TAG would overwrite it"
              exit 1
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: eventail-docs
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: ./.github/actions/setup
      - run: pnpm config-schema
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/eventail-docs
          token: ${{ steps.app-token.outputs.token }}
          path: eventail-docs
      - working-directory: eventail-docs
        env:
          TAG: ${{ inputs.tag }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${TAG#v}"
          minor="${version%.*}"

          user_id="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          target="docs/public/config/furry-schedule-adapter/v$minor.json"

          mkdir -p "$(dirname "$target")"
          cp ../config.schema.json "$target"
          git add "$target"

          if git diff --cached --quiet; then
              echo "The docs already hold the $version schema"
              exit 0
          fi

          git commit -m "docs: publish the furry schedule adapter $version configuration"
          git pull --rebase
          # main accepts a direct push only because the App is on the docs ruleset's bypass list.
          git push
