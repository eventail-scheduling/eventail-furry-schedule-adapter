name: Setup
description: Installs pnpm, Node.js and the dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install
      shell: bash
