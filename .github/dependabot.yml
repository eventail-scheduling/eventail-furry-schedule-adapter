version: 2

updates:
  - package-ecosystem: github-actions
    # The root alone covers only .github/workflows, not the local actions.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 1
    groups:
      npm:
        patterns:
          - "*"
